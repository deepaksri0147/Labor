services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: labor_gateway
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: { context: ., target: api }
    command: alembic upgrade head
    environment:
      GATEWAY_DATABASE_URL: postgresql+psycopg://gateway:gateway@postgres:5432/labor_gateway
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., target: api }
    environment:
      GATEWAY_DATABASE_URL: postgresql+psycopg://gateway:gateway@postgres:5432/labor_gateway
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_INFERENCE_BASE_URL: http://llm-gateway-inference:8080
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    build: { context: ., target: worker }
    environment:
      GATEWAY_DATABASE_URL: postgresql+psycopg://gateway:gateway@postgres:5432/labor_gateway
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_INFERENCE_BASE_URL: http://llm-gateway-inference:8080
    deploy: { replicas: 2 }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  camunda-worker:
    build: { context: ., target: worker }
    command: python -m app.worker.camunda_worker
    environment:
      GATEWAY_DATABASE_URL: postgresql+psycopg://gateway:gateway@postgres:5432/labor_gateway
      GATEWAY_REDIS_URL: redis://redis:6379/0
      GATEWAY_BOB_BASE_URL: http://bob-service:8080
      GATEWAY_INFERENCE_BASE_URL: http://llm-gateway-inference:8080
    deploy: { replicas: 2 }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
